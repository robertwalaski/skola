<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabliczka mnożenia i dzielenia</title>
<style>
:root{
  --paper:#EAF0F6;
  --card:#FFFFFF;
  --ink:#16202D;
  --ink-soft:#5A6875;
  --line:#CBD6E2;
  --blue:#2563A8;
  --blue-soft:#DCE9F7;
  --green:#1F8A5B;
  --green-soft:#D9F0E4;
  --red:#C43B3B;
  --red-soft:#FBE0E0;
  --gold:#E0A106;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.sub{color:var(--ink-soft);font-size:15px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.lab{font-size:14px;color:var(--ink-soft);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
button{
  font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;
  padding:0 14px;height:44px;cursor:pointer;
}
button:hover{border-color:var(--blue)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.chip{min-width:48px;padding:0 12px}
.grow{flex:1}
.slider{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.slider label{font-size:15px;color:var(--ink-soft);min-width:140px}
input[type=range]{flex:1;accent-color:var(--blue);height:24px}
.out{font-weight:600;min-width:70px;text-align:right}
.big{width:100%;height:52px;font-size:18px;font-weight:600;background:var(--blue);color:#fff;border-color:var(--blue)}
.big:hover{background:#1E508A}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:600;line-height:1.2}
.stat span{font-size:13px;color:var(--ink-soft)}
.bar{height:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:24px}
.bar>div{height:100%;background:var(--gold);width:100%}
.q{text-align:center;font-size:56px;font-weight:600;letter-spacing:2px;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.fb{text-align:center;min-height:28px;font-size:17px;font-weight:600;margin-bottom:14px}
.ans{display:flex;gap:10px;justify-content:center}
input[type=text]{
  font:inherit;font-size:26px;font-weight:600;text-align:center;
  width:150px;height:56px;border:2px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums;
}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.err{text-align:center;font-size:14px;color:var(--red);min-height:22px;margin-top:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:16px auto 0}
.pad button{height:60px;font-size:26px;font-weight:600;padding:0;border-radius:12px}
.pad button:active{background:var(--blue-soft)}
.pad .del{background:var(--red-soft);border-color:var(--red-soft);color:var(--red);font-size:24px}
.pad .del:active{background:var(--red);color:#fff}
.pad .go{background:var(--blue);border-color:var(--blue);color:#fff;font-size:20px}
.pad .go:hover{background:#1E508A}
.pad .go:active{background:#1E508A}
.badge{display:inline-block;font-size:15px;font-weight:600;padding:6px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-variant-numeric:tabular-nums}
.ok{color:var(--green)}
.no{color:var(--red)}
.done{background:var(--green-soft);color:var(--green);border-radius:var(--r);padding:14px;font-weight:600}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:400px){.q{font-size:46px}.stat b{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">

<h1>Tabliczka mnożenia i dzielenia</h1>
<p class="sub">Wybierz tabliczki, potem licz.</p>

<section id="setup" class="card">
  <p class="lab">Tabliczki</p>
  <div class="row" id="tables"></div>

  <p class="lab">Działania</p>
  <div class="row">
    <button class="chip grow mode" data-m="mul">Mnożenie</button>
    <button class="chip grow mode" data-m="div">Dzielenie</button>
    <button class="chip grow mode" data-m="mix">Mieszane</button>
  </div>

  <div class="slider"><label for="maxn">Drugi czynnik do</label><input type="range" id="maxn" min="5" max="20" step="1" value="10"><span class="out" id="maxout">10</span></div>
  <div class="slider"><label for="qcount">Liczba pytań</label><input type="range" id="qcount" min="10" max="60" step="5" value="20"><span class="out" id="qcout">20</span></div>
  <div class="row" style="margin-bottom:14px">
    <button class="chip grow" id="ttoggle" aria-pressed="true">Na czas</button>
  </div>
  <div class="slider" id="tlimitrow"><label for="tlimit">Czas na pytanie</label><input type="range" id="tlimit" min="1" max="20" step="1" value="10"><span class="out" id="tlout">10 s</span></div>

  <p class="err" id="serr"></p>
  <button class="big" id="start">Start</button>
  <p class="lab" id="record" style="margin:14px 0 0;text-align:center"></p>
</section>

<section id="game" class="hide">
  <div class="stats">
    <div class="stat"><b id="score">0</b><span>punkty</span></div>
    <div class="stat"><b id="streak">0</b><span>seria</span></div>
    <div class="stat"><b id="prog">1/20</b><span>pytanie</span></div>
  </div>
  <div class="bar"><div id="tbar"></div></div>
  <div class="card">
    <p class="q" id="question">6 : 3</p>
    <p class="fb" id="feedback"></p>
    <div class="ans">
      <input type="text" id="answer" inputmode="none" readonly autocomplete="off" aria-label="Odpowiedź">
    </div>
    <p class="err" id="err"></p>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" class="del" aria-label="Skasuj cyfrę">&#9003;</button>
      <button data-k="0">0</button>
      <button data-k="go" class="go" aria-label="Sprawdź">OK</button>
    </div>
  </div>
  <button id="quit" style="width:100%;margin-top:14px">Przerwij</button>
</section>

<section id="result" class="hide">
  <div class="stats">
    <div class="stat"><b id="rscore">0</b><span>wynik</span></div>
    <div class="stat"><b id="racc">0%</b><span>poprawne</span></div>
    <div class="stat"><b id="rtime">0 s</b><span>średni czas</span></div>
  </div>
  <div class="card" id="weak"></div>
  <div class="row" style="margin-top:14px">
    <button class="grow" id="again">Jeszcze raz</button>
    <button class="grow" id="hard">Tylko trudne</button>
    <button class="grow" id="back">Ustawienia</button>
  </div>
</section>

</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var S={tabs:[2,3],mode:'mix',max:10,count:20,limit:10,i:0,score:0,streak:0,queue:[],cur:null,t0:0,timer:null,left:0,times:[],wrong:{},hardOnly:null,recent:[],last:null,recentMax:0};
var STORE='tabliczka.v1';
var mem={best:0,wrong:{}};
try{var raw=localStorage.getItem(STORE);if(raw)mem=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(mem))}catch(e){}}
function showRecord(){$('record').textContent=mem.best?('Rekord: '+mem.best+' pkt'):''}
showRecord();

var tw=$('tables');
for(var n=2;n<=12;n++){
  var b=document.createElement('button');
  b.className='chip';b.textContent=n;b.dataset.t=n;
  b.setAttribute('aria-pressed',(n===2||n===3)?'true':'false');
  tw.appendChild(b);
}
tw.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');
  $('serr').textContent='';
});
document.querySelectorAll('.mode').forEach(function(b){
  b.setAttribute('aria-pressed',b.dataset.m==='mix'?'true':'false');
  b.addEventListener('click',function(){
    document.querySelectorAll('.mode').forEach(function(x){x.setAttribute('aria-pressed','false')});
    b.setAttribute('aria-pressed','true');S.mode=b.dataset.m;
  });
});
function bind(s,o,f){var el=$(s);el.addEventListener('input',function(){$(o).textContent=f(el.value)})}
bind('maxn','maxout',function(v){return v});
bind('qcount','qcout',function(v){return v});
bind('tlimit','tlout',function(v){return v+' s'});
$('ttoggle').addEventListener('click',function(){
  var on=$('ttoggle').getAttribute('aria-pressed')!=='true';
  $('ttoggle').setAttribute('aria-pressed',on?'true':'false');
  $('ttoggle').textContent=on?'Na czas':'Bez czasu';
  $('tlimitrow').classList.toggle('hide',!on);
});

function build(){
  var t=S.tabs[Math.floor(Math.random()*S.tabs.length)];
  var o=1+Math.floor(Math.random()*S.max);
  var op=S.mode==='mix'?(Math.random()<0.5?'mul':'div'):S.mode;
  if(op==='mul')return Math.random()<0.5?{op:'mul',x:t,y:o}:{op:'mul',x:o,y:t};
  return {op:'div',x:t*o,y:t};
}
// Losuj nowe pytanie unikajac ostatnio zadanych (S.recent). Przy malej liczbie
// kombinacji nie da sie uniknac powtorzen - wtedy oddajemy ostatniego kandydata.
function make(){
  var best=null;
  for(var i=0;i<16;i++){
    var c=build();best=c;
    if(S.recent.indexOf(key(c))===-1)return c;
  }
  return best;
}
function pick(){
  if(S.hardOnly&&S.hardOnly.length){
    var h;for(var i=0;i<8;i++){h=S.hardOnly[Math.floor(Math.random()*S.hardOnly.length)];if(key(h)!==S.last)break}
    return h;
  }
  if(S.queue.length&&Math.random()<0.45){
    var idx=Math.floor(Math.random()*S.queue.length);
    if(S.queue.length>1&&key(S.queue[idx])===S.last)idx=(idx+1)%S.queue.length;
    return S.queue.splice(idx,1)[0];
  }
  return make();
}
function txt(c){return c.x+(c.op==='mul'?' \u00D7 ':' : ')+c.y}
function val(c){return c.op==='mul'?c.x*c.y:c.x/c.y}
function key(c){return c.op+'|'+c.x+'|'+c.y}
function fromKey(k){var p=k.split('|');return {op:p[0],x:Number(p[1]),y:Number(p[2])}}
function stop(){if(S.timer){clearInterval(S.timer);S.timer=null}}

function next(){
  stop();
  if(S.i>=S.count)return finish();
  S.cur=pick();S.i++;
  var _k=key(S.cur);S.last=_k;S.recent.push(_k);
  while(S.recent.length>S.recentMax)S.recent.shift();
  $('question').textContent=txt(S.cur);
  $('prog').textContent=S.i+'/'+S.count;
  $('answer').value='';$('err').textContent='';$('feedback').textContent='';
  $('answer').focus();S.t0=Date.now();
  if(S.limit>0){
    S.left=S.limit*1000;$('tbar').style.width='100%';
    S.timer=setInterval(function(){
      S.left-=100;
      $('tbar').style.width=Math.max(0,S.left/(S.limit*1000))*100+'%';
      if(S.left<=0){stop();miss(true)}
    },100);
  }else{$('tbar').style.width='100%'}
}
function miss(timeUp){
  var k=key(S.cur);
  S.wrong[k]=(S.wrong[k]||0)+1;
  mem.wrong[k]=(mem.wrong[k]||0)+1;save();
  S.queue.push(S.cur);S.queue.push(S.cur);
  S.streak=0;$('streak').textContent='0';
  $('feedback').innerHTML='<span class="no">'+(timeUp?'Czas minął. ':'Nie. ')+'Poprawnie: '+val(S.cur)+'</span>';
  setTimeout(next,1700);
}
function check(){
  if(!S.cur)return;
  var v=$('answer').value.trim();
  if(v===''||isNaN(Number(v))){$('err').textContent='Wpisz odpowiedź';return}
  $('err').textContent='';stop();
  var dt=(Date.now()-S.t0)/1000;S.times.push(dt);
  if(Number(v)===val(S.cur)){
    var bonus=S.limit>0?Math.max(0,Math.round((S.limit-dt)*2)):0;
    S.streak++;
    var pts=10+bonus+(S.streak>=5?10:0);
    S.score+=pts;
    $('score').textContent=S.score;$('streak').textContent=S.streak;
    $('feedback').innerHTML='<span class="ok">Dobrze, +'+pts+'</span>';
    setTimeout(next,600);
  }else miss(false);
}
function finish(){
  stop();
  $('game').classList.add('hide');$('result').classList.remove('hide');
  var wt=0,ks=Object.keys(S.wrong);ks.forEach(function(k){wt+=S.wrong[k]});
  $('rscore').textContent=S.score;
  $('racc').textContent=Math.max(0,Math.round(((S.count-wt)/S.count)*100))+'%';
  var avg=S.times.length?S.times.reduce(function(a,b){return a+b},0)/S.times.length:0;
  $('rtime').textContent=avg.toFixed(1)+' s';
  if(S.score>(mem.best||0)){mem.best=S.score;save()}
  showRecord();
  ks.sort(function(a,b){return S.wrong[b]-S.wrong[a]});
  if(ks.length){
    var h='<p class="lab">Najczęstsze pomyłki</p><div class="row" style="margin:0">';
    ks.slice(0,10).forEach(function(k){
      var c=fromKey(k);
      h+='<span class="badge">'+txt(c)+' = '+val(c)+' ('+S.wrong[k]+')</span>';
    });
    $('weak').innerHTML=h+'</div>';
  }else{
    $('weak').innerHTML='<p class="done" style="margin:0">Bezbłędnie. Można dołożyć kolejną tabliczkę.</p>';
  }
}
function reset(hard){
  S.i=0;S.score=0;S.streak=0;S.queue=[];S.times=[];S.recent=[];S.last=null;
  // Okno unikania powtorzen - mniejsze niz liczba mozliwych kombinacji, inaczej
  // make() nie mialoby czego zwrocic (perOp: mul ma 2 uklady, div 1, mix 3).
  var perOp=S.mode==='mix'?3:(S.mode==='mul'?2:1);
  S.recentMax=Math.max(0,Math.min(8,S.tabs.length*S.max*perOp-2));
  if(hard){
    var src=Object.keys(S.wrong).length?S.wrong:mem.wrong;
    var ks=Object.keys(src).sort(function(a,b){return src[b]-src[a]}).slice(0,10);
    S.hardOnly=ks.map(fromKey);
    if(!S.hardOnly.length)S.hardOnly=null;
  }else S.hardOnly=null;
  S.wrong={};
  $('score').textContent='0';$('streak').textContent='0';
  $('result').classList.add('hide');$('setup').classList.add('hide');$('game').classList.remove('hide');
  next();
}
$('start').addEventListener('click',function(){
  var t=[];document.querySelectorAll('#tables button').forEach(function(b){if(b.getAttribute('aria-pressed')==='true')t.push(Number(b.dataset.t))});
  if(!t.length){$('serr').textContent='Wybierz co najmniej jedną tabliczkę';return}
  S.tabs=t;S.max=Number($('maxn').value);S.count=Number($('qcount').value);
  S.limit=$('ttoggle').getAttribute('aria-pressed')==='true'?Number($('tlimit').value):0;
  reset(false);
});
function press(k){
  var el=$('answer');
  if(k==='go'){check();return}
  if(k==='del')el.value=el.value.slice(0,-1);
  else if(el.value.length<4)el.value+=k;
  $('err').textContent='';
}
$('pad').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  press(b.dataset.k);
});
document.addEventListener('keydown',function(e){
  if($('game').classList.contains('hide'))return;
  if(e.key>='0'&&e.key<='9'){e.preventDefault();press(e.key)}
  else if(e.key==='Backspace'){e.preventDefault();press('del')}
  else if(e.key==='Enter'){e.preventDefault();press('go')}
});
$('quit').addEventListener('click',function(){stop();$('game').classList.add('hide');$('setup').classList.remove('hide')});
$('again').addEventListener('click',function(){reset(false)});
$('hard').addEventListener('click',function(){reset(true)});
$('back').addEventListener('click',function(){$('result').classList.add('hide');$('setup').classList.remove('hide')});
})();
</script>
</body>
</html>
