<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szkoła - aplikacje</title>
<style>
:root{
  --paper:#EAF0F6;
  --card:#FFFFFF;
  --ink:#16202D;
  --ink-soft:#5A6875;
  --line:#CBD6E2;
  --blue:#2563A8;
  --blue-soft:#DCE9F7;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;
}
.wrap{max-width:880px;margin:0 auto;padding:40px 16px 56px}
header{text-align:center;margin-bottom:32px}
h1{font-size:30px;font-weight:700;margin:0 0 6px}
.sub{color:var(--ink-soft);font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.app{
  display:flex;flex-direction:column;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 20px;text-decoration:none;color:inherit;
  transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
}
.app:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 8px 22px rgba(37,99,168,.12)}
.app:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ico{font-size:40px;line-height:1}
.app h2{font-size:20px;font-weight:600;margin:6px 0 0}
.app p{font-size:14px;color:var(--ink-soft);margin:0}
.soon{opacity:.55;pointer-events:none}
.soon .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--ink-soft);border:1px dashed var(--line);border-radius:8px;padding:2px 8px;margin-top:4px}
footer{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:36px}
@media (prefers-reduced-motion:reduce){.app{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Szkoła</h1>
    <p class="sub">Aplikacje do nauki</p>
  </header>

  <div class="grid">
    <a class="app" href="tabliczka.html">
      <span class="ico">✖️</span>
      <h2>Tabliczka mnożenia</h2>
      <p>Mnożenie i dzielenie na czas, z klawiaturą numeryczną.</p>
    </a>

    <div class="app soon">
      <span class="ico">➕</span>
      <h2>Wkrótce</h2>
      <p>Miejsce na kolejną aplikację.</p>
      <span class="tag">w przygotowaniu</span>
    </div>
  </div>

  <footer>szkola.dev.interwal.net</footer>
</div>
</body>
</html>
